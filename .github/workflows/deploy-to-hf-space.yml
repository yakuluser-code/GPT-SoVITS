name: Deploy to Hugging Face Space

on:
  push:
    branches: [ space-lite ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Space (yakuldog/GPT-SoVITS)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # set this in GitHub: Settings → Secrets → Actions
        run: |
          set -e
          git remote add space https://user:${HF_TOKEN}@huggingface.co/spaces/yakuldog/GPT-SoVITS || \
          git remote set-url space https://user:${HF_TOKEN}@huggingface.co/spaces/yakuldog/GPT-SoVITS
          # Push the current commit on space-lite to the Space's default branch (main)
          git push --force space HEAD:main
